# Execução com PostgreSQL:  cp .env.example .env  (edite)  &&  docker compose up --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: cronomed
      POSTGRES_USER: cronomed
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no arquivo .env}
    volumes:
      - dados_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cronomed"]
      interval: 5s
      retries: 10
  web:
    build: .
    env_file: .env
    environment:
      CRONOMED_MEDIA_ROOT: /dados/media
    volumes:
      - dados_media:/dados/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  dados_pg:
  dados_media:
